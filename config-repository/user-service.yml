spring:
  application:
    name: user-service
  datasource:
    username: postgres
    url: jdbc:postgresql://localhost:5432/users_db
    password: password

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update

jwt:
  secret: MySuperSecretKey1234567890AbCdEfGhIjKlMnOpQrStUvWxYzABCDEFGH
  expiration: 3600000
  refresh-expiration: 86400000

server:
  port: 8081
