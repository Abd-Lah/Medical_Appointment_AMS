spring:
  cloud:
    config:
      enabled: true
    discovery:
      enabled: true

eureka:
  client:
    enabled: true
    okhttp:
      enabled: true

    service-url:
      defaultZone: http://127.0.0.1:8761/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: ["health", "refresh"]
