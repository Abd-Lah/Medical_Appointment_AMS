spring:
  application:
    name: config-service
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  profiles:
    active: native
  cloud:
    config:
      enabled: true
      server:
        native:
          search-locations: file:/home/abd/Desktop/Medical_Appointment_AMS/config-repository
    discovery:
      enabled: true

eureka:
  client:
    enabled: true

    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: ["*"]

server:
  port: 9999
